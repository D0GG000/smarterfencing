<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{post.title}}</title></head>
<body>
  <a href="/blog">← Back</a>
  <h1>{{ post.title }}</h1>

  <div>{{ post.body_html | safe }}</div>

  <hr>
  <button id="likeBtn">{{ "♥ Liked" if liked else "♡ Like" }}</button>
  <span id="likeCount">{{ like_count }}</span>

  <hr>
  <h3>Comments</h3>
  <div id="comments">
    {% for c in comments %}
      <p><b>{{c.author_name}}</b>: {{c.body}}</p>
    {% endfor %}
  </div>

  <h4>Leave a comment</h4>
  <input id="name" placeholder="Your name" />
  <br>
  <textarea id="body" placeholder="Your comment"></textarea>
  <br>
  <button id="commentBtn">Submit</button>
  <p id="msg"></p>

<script>
document.getElementById('likeBtn').addEventListener('click', async () => {
  const res = await fetch('/api/blog/{{post.id}}/like', { method: 'POST' });
  const data = await res.json();
  document.getElementById('likeCount').textContent = data.like_count;
  document.getElementById('likeBtn').textContent = data.liked ? '♥ Liked' : '♡ Like';
});

document.getElementById('commentBtn').addEventListener('click', async () => {
  const payload = {
    author_name: document.getElementById('name').value,
    body: document.getElementById('body').value
  };
  const res = await fetch('/api/blog/{{post.id}}/comments', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('msg').textContent = data.message || data.error || 'Done';
});
</script>
</body>
</html>
