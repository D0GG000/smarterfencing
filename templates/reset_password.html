<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% set seo_title = "Reset password – SmarterFencing" %}
    {% set seo_robots = "noindex,nofollow" %}
    {% include 'seo.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-white">
    {% include 'header.html' %}

    <main class="max-w-md mx-auto p-4 pt-6">
        <div class="rounded-2xl border p-6" style="background: var(--panel); border-color: var(--border);">
            <h1 class="text-xl font-bold mb-2" style="font-family: var(--font-display);">Choose a new password</h1>
            <p class="text-sm text-gray-400 mb-5">Enter a new password for your SmarterFencing account.</p>

            <input type="hidden" id="resetToken" value="{{ token|e }}">

            <label class="text-xs text-gray-400 block mb-1" for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="8" autocomplete="new-password"
                   placeholder="At least 8 characters"
                   class="w-full mb-3 px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 text-sm">

            <label class="text-xs text-gray-400 block mb-1" for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password"
                   placeholder="Repeat password"
                   class="w-full mb-4 px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 text-sm">

            <button type="button" id="resetSubmitBtn"
                    class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium">
                Update password
            </button>

            <p id="resetMsg" class="text-sm mt-4 min-h-[1.25rem] text-red-400"></p>

            <p class="text-sm text-gray-500 mt-4">
                <a href="{{ url_for('demo.demo') }}#sign-in" class="text-sky-400 hover:text-sky-300">Back to sign in</a>
            </p>
        </div>
    </main>

    <script>
        const TOKEN = document.getElementById('resetToken').value;

        async function submitReset() {
            const msg = document.getElementById('resetMsg');
            const btn = document.getElementById('resetSubmitBtn');
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            msg.textContent = '';
            msg.className = 'text-sm mt-4 min-h-[1.25rem] text-red-400';

            if (!TOKEN) {
                msg.textContent = 'Missing reset token. Use the link from your email or request a new one.';
                return;
            }
            if (password.length < 8) {
                msg.textContent = 'Password must be at least 8 characters.';
                return;
            }
            if (password !== confirm) {
                msg.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ token: TOKEN, password }),
                });
                const data = await res.json();
                if (!data.success) {
                    throw new Error(data.error || 'Reset failed');
                }
                msg.className = 'text-sm mt-4 min-h-[1.25rem] text-green-400';
                msg.textContent = data.message || 'Password updated.';
                setTimeout(() => { window.location.href = '/demo'; }, 1200);
            } catch (e) {
                msg.textContent = e.message || String(e);
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('resetSubmitBtn').addEventListener('click', submitReset);
    </script>
</body>
</html>
